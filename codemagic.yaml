# Codemagic: Bastion Road iOS -> App Store Connect / TestFlight.
# No Unity on the build machine (Unity Personal cannot be activated in CI): the Xcode project is exported on the
# developer's Windows PC (BuildScript.BuildIOS) and committed to the `ios-export` branch (big binaries via Git LFS).
# Codemagic only installs CocoaPods, signs, builds the IPA and uploads it to TestFlight.
# How to release a new iOS build: see "Releasing a new iOS build" in Store/SUBMISSION.md.
# Set up once in the Codemagic UI:
#   1. Integrations -> Developer Portal: App Store Connect API key named "codemagic".
#   2. Code signing: automatic (ios_signing below) for com.virabyan.bastionroad.
workflows:
  ios-release:
    name: Bastion Road iOS
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.virabyan.bastionroad
      vars:
        APP_STORE_APP_ID: 6832220428
        XCODE_PROJECT: Builds/iOS/Unity-iPhone.xcodeproj
        XCODE_WORKSPACE: Builds/iOS/Unity-iPhone.xcworkspace
        XCODE_SCHEME: Unity-iPhone
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Fetch Git LFS files (UnityRuntime, *.a)
        script: |
          git lfs install && git lfs pull
      - name: Build number = latest App Store / TestFlight build + 1
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" || echo 0)
          LATEST_TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
          [ "$LATEST_TF" -gt "$LATEST" ] && LATEST=$LATEST_TF
          BUILD_NUMBER=$((LATEST + 1))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
          # The Unity export has no apple-generic versioning (agvtool would not work) and a literal
          # CFBundleVersion in Info.plist, so set it there directly.
          cd Builds/iOS
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Info.plist
          echo "CFBundleVersion = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)"
      - name: CocoaPods (AdMob, Unity Ads adapter, UMP; Firebase comes via Swift Package Manager)
        script: |
          cd Builds/iOS && pod install --repo-update
      - name: Apply signing profiles
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build IPA
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
